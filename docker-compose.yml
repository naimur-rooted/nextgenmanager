version: '3'
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextgen_erp
    ports:
      - "5432:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  app:
    build: .
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nextgen_erp
      SECRET_KEY: change-this-to-a-long-random-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:3000","https://nextgen-garment-erp.onrender.com"]'
      FRONTEND_URL: http://localhost:3000
      DEBUG: "false"
      API_PREFIX: /api

  frontend:
    build:
      context: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000/api

volumes:
  minio_data:</arg_value>
</write_to_file></tool_call>